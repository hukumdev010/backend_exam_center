name: Deploy to EC2

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          # Create SSH directory
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          # Create SSH private key file
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Debug: Check key file
          echo "SSH key file size: $(wc -c < ~/.ssh/id_rsa) bytes"
          echo "SSH key starts with:"
          head -1 ~/.ssh/id_rsa
          echo "SSH key ends with:"
          tail -1 ~/.ssh/id_rsa

          # Verify key format and fix potential issues
          if ! ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null 2>&1; then
            echo "SSH key validation failed, attempting to fix format..."
            # Remove any Windows line endings and ensure proper format
            sed -i 's/\r$//' ~/.ssh/id_rsa
            # Ensure the key has proper newlines
            if ! grep -q "BEGIN.*PRIVATE KEY" ~/.ssh/id_rsa; then
              echo "ERROR: SSH key doesn't appear to be in correct format"
              exit 1
            fi
            # Try validation again after fixing
            if ! ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null 2>&1; then
              echo "ERROR: SSH key is still invalid after attempting fixes"
              exit 1
            fi
            echo "SSH key fixed and validated successfully"
          else
            echo "SSH key validation successful"
          fi

          # Generate and show public key fingerprint for verification
          echo "SSH key fingerprint:"
          ssh-keygen -l -f ~/.ssh/id_rsa

          # Add EC2 to known hosts
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts
          
          echo "SSH setup completed - using direct key file access"

      - name: Debug Secrets
        run: |
          echo "Debug: Checking secret values..."
          echo "EC2_HOST length: ${#EC2_HOST}"
          echo "EC2_USER length: ${#EC2_USER}"
          if [ -z "$EC2_HOST" ]; then
            echo "ERROR: EC2_HOST is empty"bn     
            exit 1
          fi
          if [ -z "$EC2_USER" ]; then
            echo "ERROR: EC2_USER is empty"
            exit 1
          fi
          echo "Secrets appear to be set"
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}

      - name: Fix SSH Key Format
        run: |
          echo "Checking and fixing SSH key format..."
          
          # Check if key validation fails and fix it
          if ! ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null 2>&1; then
            echo "Key validation failed, attempting to fix..."
            
            # Remove any carriage returns and ensure proper format
            sed -i 's/\r$//' ~/.ssh/id_rsa
            
            # Ensure proper newlines and format
            if ! grep -q "BEGIN.*PRIVATE KEY" ~/.ssh/id_rsa; then
              echo "ERROR: Key doesn't contain proper BEGIN marker"
              head -n3 ~/.ssh/id_rsa
              exit 1
            fi
            
            # Set correct permissions
            chmod 600 ~/.ssh/id_rsa
            
            # Test again
            if ! ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null 2>&1; then
              echo "ERROR: Key is still invalid after fixes"
              exit 1
            fi
            
            echo "✅ Key fixed successfully"
          else
            echo "✅ Key is already valid"
          fi
          
          # Show final key info
          echo "Final key fingerprint:"
          ssh-keygen -l -f ~/.ssh/id_rsa

      - name: Test SSH Connection
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          echo "Testing SSH connection to $EC2_USER@$EC2_HOST"
          
          # Debug key file status
          echo "Key file permissions:"
          ls -la ~/.ssh/id_rsa
          echo "Key file size: $(wc -c < ~/.ssh/id_rsa) bytes"
          
          # Test key validity
          echo "Testing key validity:"
          if ssh-keygen -y -f ~/.ssh/id_rsa > /dev/null 2>&1; then
            echo "✅ SSH key is valid"
            echo "Public key fingerprint:"
            ssh-keygen -l -f ~/.ssh/id_rsa
          else
            echo "❌ SSH key validation failed"
            echo "Key file content (first and last lines):"
            head -n1 ~/.ssh/id_rsa
            tail -n1 ~/.ssh/id_rsa
          fi
          
          # Test connection using the key file directly
          echo "Attempting SSH connection:"
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "echo 'SSH test successful - $(whoami)@$(hostname)'" || echo "SSH connection failed"

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          echo "Connecting to $EC2_USER@$EC2_HOST"
          
          # Create deployment script
          cat > deploy_script.sh << 'SCRIPT_EOF'
            set -e
            
            echo "=== Starting deployment ==="
            
            # Navigate to application directory
            cd /var/www/backend_exam_center || {
              echo "Creating application directory..."
              sudo mkdir -p /var/www/backend_exam_center
              sudo chown $USER:$USER /var/www/backend_exam_center
              cd /var/www/backend_exam_center
            }
            
            # Clone or update repository
            if [ ! -d ".git" ]; then
              echo "Cloning repository..."
              git clone git@github.com:hukumdev010/backend_exam_center.git .
            else
              echo "Updating repository..."
              git fetch origin
              git reset --hard origin/master
            fi
            
            echo "=== Setting up Python environment ==="
            
            # Install Python 3.11 if not present
            if ! command -v python3.11 &> /dev/null; then
              echo "Installing Python 3.11..."
              sudo apt update
              sudo apt install -y python3.11 python3.11-venv python3.11-dev
            fi
            
            # Create virtual environment
            if [ ! -d "backend/venv" ]; then
              echo "Creating virtual environment..."
              cd backend
              python3.11 -m venv venv
              cd ..
            fi
            
            # Activate virtual environment and install dependencies
            echo "Installing dependencies..."
            cd backend
            source venv/bin/activate
            pip install --upgrade pip
            pip install -r requirements.txt
            
            echo "=== Running database migrations ==="
            # Run Alembic migrations
            alembic upgrade head || echo "No migrations to run"
            
            echo "=== Restarting services ==="
            
            # Create systemd service file if it doesn't exist
            if [ ! -f "/etc/systemd/system/exam-center-backend.service" ]; then
              echo "Creating systemd service..."
              sudo tee /etc/systemd/system/exam-center-backend.service > /dev/null << 'SERVICE_EOF'
          [Unit]
          Description=Exam Center FastAPI Backend
          After=network.target

          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=/var/www/backend_exam_center/backend
          Environment="PATH=/var/www/backend_exam_center/backend/venv/bin"
          ExecStart=/var/www/backend_exam_center/backend/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000
          Restart=always
          RestartSec=10

          [Install]
          WantedBy=multi-user.target
          SERVICE_EOF
              
              sudo systemctl daemon-reload
              sudo systemctl enable exam-center-backend
            fi
            
            # Restart the service
            sudo systemctl restart exam-center-backend
            
            # Wait a moment and check status
            sleep 5
            sudo systemctl status exam-center-backend --no-pager
            
            echo "=== Restarting Nginx ==="
            sudo systemctl restart nginx
            sudo systemctl status nginx --no-pager
            
            echo "=== Deployment completed successfully ==="
          SCRIPT_EOF
          
          # Upload and execute the script
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no deploy_script.sh "$EC2_USER@$EC2_HOST:~/deploy_script.sh"
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no "$EC2_USER@$EC2_HOST" "chmod +x ~/deploy_script.sh && ~/deploy_script.sh"

      - name: Health Check
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "Waiting for application to start..."
          sleep 10

          # Check if the application is responding
          curl -f -s "http://$EC2_HOST:8000/docs" > /dev/null || {
            echo "Health check failed - application may not be responding"
            exit 1
          }

          echo "✅ Application is responding successfully"
